services:
  frame-count-api:
    build:
      context: .
      target: dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - LOG_LEVEL=info
      - CHOKIDAR_USEPOLLING=1
    working_dir: /app
    command: npm run dev
    stdin_open: true
    tty: true
